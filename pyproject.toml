[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    "chess_v3.10",
    "data",
    "logs",
    "scripts",  # one-off data-conversion utilities, not shipped app code
    "**/__pycache__",
]

[tool.ruff.lint]
# Strict / full modernize: pyflakes, pycodestyle, isort, bugbear, comprehensions,
# pyupgrade (incl. UP006/UP045 typing rewrites), simplify, and Ruff-native lints.
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = [
    "SIM108",  # ternary-instead-of-if — often less readable here
    "SIM102",  # collapsible-if — nested guards in feature/motif detection are
               # intentionally layered with per-level comments; collapsing is lossy
    "RUF012",  # mutable class defaults — pydantic/config patterns trip this
    "B008",    # function call in default arg — FastAPI Depends() idiom
    # E501 is owned by the formatter (line-length = 88). The formatter reflows
    # all code; the only residual long lines are prompt strings, docstrings, and
    # comments it intentionally won't split, so linting E501 here is pure noise.
    "E501",
    # Ambiguous-unicode rules flag deliberate typography (en dashes, minus signs)
    # in user-facing prose, docstrings, and LLM prompt strings — not code hazards.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long inline fixtures/expected strings in tests

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["app"]
omit = ["app/**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

